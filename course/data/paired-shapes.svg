<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-label="Image-text alignment in a controlled world"><rect width="720" height="250" fill="#f8fafc"/><g font-family="sans-serif" fill="#15233b"><text x="24" y="32" font-size="20" font-weight="bold">Image-text alignment in a controlled world</text><rect x="24" y="65" width="100" height="100" fill="#111827"/><rect x="24" y="90" width="50" height="50" fill="#ef4444"/><text x="24" y="190" font-size="13">red left</text><rect x="138" y="65" width="100" height="100" fill="#111827"/><rect x="188" y="90" width="50" height="50" fill="#ef4444"/><text x="138" y="190" font-size="13">red right</text><rect x="252" y="65" width="100" height="100" fill="#111827"/><rect x="252" y="90" width="50" height="50" fill="#22c55e"/><text x="252" y="190" font-size="13">green left</text><rect x="366" y="65" width="100" height="100" fill="#111827"/><rect x="416" y="90" width="50" height="50" fill="#22c55e"/><text x="366" y="190" font-size="13">green right</text><rect x="480" y="65" width="100" height="100" fill="#111827"/><rect x="480" y="90" width="50" height="50" fill="#3b82f6"/><text x="480" y="190" font-size="13">blue left</text><rect x="594" y="65" width="100" height="100" fill="#111827"/><rect x="644" y="90" width="50" height="50" fill="#3b82f6"/><text x="594" y="190" font-size="13">blue right</text><text x="24" y="225" font-size="14">Train on five combinations; hold out blue-right. Does alignment compose?</text></g></svg>
