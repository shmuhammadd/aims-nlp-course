<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-label="Sampling can preserve motion while missing a brief event"><rect width="720" height="250" fill="#f8fafc"/><g font-family="sans-serif" fill="#15233b"><text x="24" y="32" font-size="20" font-weight="bold">Sampling can preserve motion while missing a brief event</text><rect x="24" y="70" width="120" height="70" fill="#111827"/><rect x="24" y="98" width="16" height="16" fill="white"/><text x="24" y="163" font-size="14">Frame 0</text><rect x="162" y="70" width="120" height="70" fill="#111827"/><rect x="178" y="98" width="16" height="16" fill="white"/><text x="162" y="163" font-size="14">Frame 4</text><rect x="300" y="70" width="120" height="70" fill="#111827"/><rect x="328" y="98" width="16" height="16" fill="white"/><text x="300" y="163" font-size="14">Frame 7</text><rect x="300" y="70" width="14" height="14" fill="#ef4444"/><rect x="438" y="70" width="120" height="70" fill="#111827"/><rect x="486" y="98" width="16" height="16" fill="white"/><text x="438" y="163" font-size="14">Frame 12</text><rect x="576" y="70" width="120" height="70" fill="#111827"/><rect x="656" y="98" width="16" height="16" fill="white"/><text x="576" y="163" font-size="14">Frame 20</text><text x="24" y="200" font-size="14">Stride 4 at offset 0 misses the red event at frame 7.</text><text x="24" y="225" font-size="14">Reverse the sequence to test whether an answer depends on order.</text></g></svg>
